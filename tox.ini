[tox]
envlist = py{36,37,38,39,310,311,312,313,315}
minversion = 3.3.0
isolated_build = true

[testenv]
deps =
    check-manifest >= 0.42
    flake8
	black
	isort

commands =
    check-manifest --ignore 'tox.ini,tests/**'
	isort --check-only --profile black .
	black --check .
    flake8 .

[flake8]
exclude = .tox,*.egg,build,data
select = E,W,F
